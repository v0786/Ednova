version: '3.8'

services:
  ednova-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ednova_app_server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=http://ednova-database:5432
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=ednova-production-anon-key-placeholder
      - SUPABASE_SERVICE_ROLE_KEY=ednova-production-service-key-placeholder
      - EDNOVA_SERVER_IDENTITY=sch-server-onpremise-001
    depends_on:
      - ednova-database
    volumes:
      - ednova_storage:/app/storage

  ednova-database:
    image: postgres:15-alpine
    container_name: ednova_postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ednova_db
      - POSTGRES_USER=ednova_admin
      - POSTGRES_PASSWORD=ednova_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./app/supabase/migrations/02_security_gate_domain.sql:/docker-entrypoint-initdb.d/02_security_gate_domain.sql
      - ./app/supabase/migrations/03_security_gate_tables.sql:/docker-entrypoint-initdb.d/03_security_gate_tables.sql
      - ./app/supabase/migrations/04_timetable_and_calendar.sql:/docker-entrypoint-initdb.d/04_timetable_and_calendar.sql
      - ./app/supabase/migrations/05_attendance_system.sql:/docker-entrypoint-initdb.d/05_attendance_system.sql
      - ./app/supabase/migrations/06_feedback_and_incidents.sql:/docker-entrypoint-initdb.d/06_feedback_and_incidents.sql
      - ./app/supabase/migrations/07_license_and_system_health.sql:/docker-entrypoint-initdb.d/07_license_and_system_health.sql
      - ./app/supabase/migrations/08_college_academic_structure.sql:/docker-entrypoint-initdb.d/08_college_academic_structure.sql
      - ./app/supabase/migrations/09_append_only_audit_locks.sql:/docker-entrypoint-initdb.d/09_append_only_audit_locks.sql
      - ./app/supabase/migrations/10_canonical_roles_and_notifications.sql:/docker-entrypoint-initdb.d/10_canonical_roles_and_notifications.sql
      - ./app/supabase/migrations/11_complete_backend_entities.sql:/docker-entrypoint-initdb.d/11_complete_backend_entities.sql

volumes:
  postgres_data:
  ednova_storage:
